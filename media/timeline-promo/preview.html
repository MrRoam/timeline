<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timeline 宣传视频预览</title>
<style>body{margin:0;background:#e8e7e4;color:#292a2e;font-family:system-ui}main{max-width:1400px;margin:24px auto;padding:0 24px}#screen{background:#f1f0ed;aspect-ratio:16/9}#screen svg{display:block;width:100%;height:100%}footer{display:flex;gap:16px;align-items:center;padding:18px 0}button{padding:8px 18px;cursor:pointer}input{flex:1}span{font-variant-numeric:tabular-nums}</style>
<main><div id="screen"></div><footer><button id="play">播放</button><input id="seek" type="range" min="0" step=".01"><span id="time"></span></footer></main>
<script type="module">
import {render,duration,width,height} from './scene.mjs';
const screen=document.querySelector('#screen'),play=document.querySelector('#play'),seek=document.querySelector('#seek'),time=document.querySelector('#time');
screen.style.aspectRatio=`${width}/${height}`;seek.max=duration;let t=0,playing=false,last=0;
const paint=()=>{screen.innerHTML=render(t);seek.value=t;time.textContent=`${t.toFixed(2)} / ${duration.toFixed(2)}秒`;play.textContent=playing?'暂停':'播放'};
play.onclick=()=>{if(t>=duration)t=0;playing=!playing;last=performance.now();paint()};
seek.oninput=()=>{t=Number(seek.value);playing=false;paint()};
function tick(now){if(playing){t=Math.min(duration,t+(now-last)/1000);if(t>=duration)playing=false;paint()}last=now;requestAnimationFrame(tick)}
paint();requestAnimationFrame(tick);
</script></html>
